<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jerry Pizza POS | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --red: #E8001D; --gold: #fbbf24; --dark: #0a0a0a; --card: #161616; --border: #2e2e2e; --text: #f0f0f0; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: 'Nunito', sans-serif; background: var(--dark); color: var(--text); height: 100dvh; overflow: hidden; overscroll-behavior: none; }

        /* --- LOGIN SCREEN --- */
        #lock-screen { position: fixed; inset: 0; background: var(--dark); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-display { font-size: 40px; letter-spacing: 15px; color: var(--gold); margin: 20px 0; font-weight: 900; }
        .pin-grid { display: grid; grid-template-columns: repeat(3, 85px); gap: 15px; }
        .pin-btn { height: 75px; border-radius: 18px; border: 2px solid var(--border); background: var(--card); color: white; font-size: 26px; font-weight: 900; }
        .pin-btn:active { background: var(--red); transform: scale(0.9); }

        /* --- MAIN APP --- */
        #app { display: none; flex-direction: column; height: 100dvh; }
        #app.visible { display: flex; }
        
        .top-nav { height: 60px; background: #000; border-bottom: 2px solid var(--red); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
        .tab-bar { display: flex; background: #000; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
        .tab { flex: 1; min-width: 110px; padding: 15px; text-align: center; font-weight: 900; font-size: 13px; color: #666; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--red); border-bottom-color: var(--red); }

        /* --- POS INTERFACE --- */
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .menu-side { flex: 1; display: flex; flex-direction: column; background: #000; }
        
        /* Smooth Category Slider */
        .cat-slider { display: flex; gap: 10px; padding: 12px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .cat-pill { background: var(--card); border: 1px solid var(--border); padding: 12px 22px; border-radius: 50px; white-space: nowrap; font-weight: 800; font-size: 13px; }
        .cat-pill.active { background: var(--red); border-color: var(--red); }

        .menu-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; padding: 12px; align-content: start; }
        .item-card { background: var(--card); border-radius: 18px; border: 1px solid var(--border); padding: 15px; text-align: center; position: relative; }
        .item-card:active { transform: scale(0.95); border-color: var(--gold); }
        .item-name { font-size: 12px; font-weight: 800; line-height: 1.2; height: 32px; overflow: hidden; margin: 8px 0; }
        .item-price { color: var(--gold); font-weight: 900; font-size: 14px; }

        /* --- CART (Responsive Bottom Sheet) --- */
        .cart-side { width: 360px; background: #080808; border-left: 1px solid var(--border); display: flex; flex-direction: column; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @media (max-width: 950px) {
            .cart-side { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; height: 80dvh; z-index: 2000; transform: translateY(100%); border-radius: 25px 25px 0 0; border-top: 5px solid var(--red); }
            .cart-side.open { transform: translateY(0); }
        }
        .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
        .cart-row { display: flex; justify-content: space-between; padding: 12px; background: var(--card); border-radius: 12px; margin-bottom: 10px; font-size: 14px; align-items: center; }
        .cart-footer { padding: 20px; background: var(--card); border-top: 1px solid var(--border); }

        /* MODALS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.open { display: flex; }
        .selection-box { background: var(--card); padding: 25px; border-radius: 25px; width: 100%; max-width: 400px; border: 1px solid var(--border); }
        .opt-row { display: flex; justify-content: space-between; padding: 18px; border: 1px solid var(--border); border-radius: 15px; margin-top: 12px; font-weight: 900; cursor: pointer; }
        .opt-row:active { background: var(--red); }

        /* DASHBOARD */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; padding: 15px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 15px; border-left: 5px solid var(--red); }

        /* BUTTONS */
        .btn-pay { width: 100%; padding: 20px; border-radius: 15px; border: none; background: var(--red); color: white; font-weight: 900; font-size: 18px; cursor: pointer; }
        .btn-float-cart { position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px; background: var(--red); border-radius: 50%; display: none; justify-content: center; align-items: center; font-size: 28px; z-index: 1500; border: none; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        @media (max-width: 950px) { .btn-float-cart { display: flex; } }
    </style>
</head>
<body>

<div id="lock-screen">
    <div style="font-family:'Bebas Neue'; color:var(--red); font-size:55px; letter-spacing:3px;">JERRY POS</div>
    <div id="pin-dots" class="pin-display">____</div>
    <div class="pin-grid">
        <script>for(let i=1;i<=9;i++) document.write(`<button class="pin-btn" onclick="pressPin('${i}')">${i}</button>`);</script>
        <button class="pin-btn" onclick="pinStr=''">C</button>
        <button class="pin-btn" onclick="pressPin('0')">0</button>
        <button class="pin-btn" onclick="tryLogin()" style="background:var(--red)">OK</button>
    </div>
</div>

<div id="app">
    <div class="top-nav">
        <div style="font-family:'Bebas Neue'; color:var(--red); font-size:26px;">ADMIN PANEL</div>
        <div id="liveClock" style="font-weight:900; color:var(--gold)">00:00:00</div>
    </div>

    <div class="tab-bar">
        <div class="tab active" onclick="switchView('pos')">🛒 TERMINAL</div>
        <div class="tab" onclick="switchView('kds')">🔥 KITCHEN</div>
        <div class="tab" onclick="switchView('dash')">📊 SALES</div>
        <div class="tab" onclick="location.reload()">🔒 LOGOUT</div>
    </div>

    <!-- TERMINAL VIEW -->
    <div id="view-pos" class="main-container">
        <div class="menu-side">
            <div class="cat-slider" id="catSlider"></div>
            <div class="menu-grid" id="menuGrid"></div>
        </div>

        <aside class="cart-side" id="cartSide">
            <div style="padding:15px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:900; letter-spacing:1px;">CURRENT ORDER</span>
                <button onclick="toggleCart()" style="background:none; border:none; color:var(--red); font-weight:900">CLOSE</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-footer">
                <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-size:22px; font-weight:900;">
                    <span>Total</span><span id="cartTotal" style="color:var(--gold)">Rs. 0</span>
                </div>
                <button class="btn-pay" onclick="sendOrder()">PLACE ORDER</button>
            </div>
        </aside>
    </div>

    <!-- KITCHEN VIEW -->
    <div id="view-kds" style="display:none; flex:1; overflow-y:auto; padding:20px;">
        <div id="kdsGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px;"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="view-dash" style="display:none; flex:1; overflow-y:auto;">
        <div class="stat-grid">
            <div class="stat-card"><h3>Gross Revenue</h3><p id="statRev" style="font-size:28px; font-weight:900; color:var(--gold)">Rs. 0</p></div>
            <div class="stat-card"><h3>Orders Today</h3><p id="statOrders" style="font-size:28px; font-weight:900; color:var(--gold)">0</p></div>
        </div>
    </div>

    <button class="btn-float-cart" onclick="toggleCart()">🛒</button>
</div>

<!-- Selection Modal -->
<div class="modal" id="selectionModal">
    <div class="selection-box">
        <h2 id="modalItemName" style="margin-bottom:10px; font-family:'Bebas Neue'; letter-spacing:2px; color:var(--red);">Select Option</h2>
        <div id="optionsContainer"></div>
        <button onclick="closeModal()" style="width:100%; margin-top:20px; padding:12px; background:none; border:1px solid #444; color:#888; border-radius:15px; font-weight:800;">CANCEL</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getDatabase, ref, get, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-database.js";

    const fbConfig = {
        apiKey: "AIzaSyBG-J0dzxS70Fr7-VPf1SQ8Fiq0fRzNAq8",
        authDomain: "jerry-pos.firebaseapp.com",
        projectId: "jerry-pos",
        databaseURL: "https://jerry-pos-default-rtdb.firebaseio.com"
    };

    const fbApp = initializeApp(fbConfig);
    const db = getDatabase(fbApp);

    window.pinStr = "";
    let fullMenu = null;
    let currentCart = [];
    let activeCatKey = "bestPizzas";

    // --- LOGIN ---
    window.pressPin = (n) => { if(pinStr.length < 4) pinStr += n; updatePinUI(); };
    function updatePinUI() { document.getElementById('pin-dots').innerText = "●".repeat(pinStr.length).padEnd(4, '_'); }
    window.tryLogin = async () => {
        const snap = await get(ref(db, `system/pins/${pinStr}`));
        if(snap.exists()){
            document.getElementById('lock-screen').style.display='none';
            document.getElementById('app').classList.add('visible');
            loadSystem();
        } else { alert("Invalid PIN"); pinStr=""; updatePinUI(); }
    };

    // --- SYSTEM LOAD ---
    async function loadSystem() {
        const snap = await get(ref(db, 'system/menu'));
        fullMenu = snap.val();
        renderCategories();
        renderMenu("bestPizzas");
        startKDS();
        setInterval(() => {
            document.getElementById('liveClock').innerText = new Date().toLocaleTimeString();
        }, 1000);
    }

    function renderCategories() {
        const cats = Object.keys(fullMenu);
        document.getElementById('catSlider').innerHTML = cats.map(c => `
            <div class="cat-pill ${c === activeCatKey ? 'active' : ''}" onclick="renderMenu('${c}')">
                ${c.replace(/([A-Z])/g, ' $1').toUpperCase()}
            </div>
        `).join('');
    }

    window.renderMenu = (catKey) => {
        activeCatKey = catKey;
        renderCategories();
        const grid = document.getElementById('menuGrid');
        const items = fullMenu[catKey];
        grid.innerHTML = items.map(item => {
            let priceLabel = "View";
            if(item.price) priceLabel = `Rs. ${item.price}`;
            else if(item.sizes) priceLabel = `Rs. ${item.sizes.S}+`;
            else if(item.price5pc) priceLabel = `Rs. ${item.price5pc}+`;
            else if(item.priceS) priceLabel = `Rs. ${item.priceS}+`;

            return `
                <div class="item-card" onclick="handleItemClick('${catKey}', '${item.name}')">
                    <div style="font-size:38px">${item.emoji || '🍕'}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${priceLabel}</div>
                </div>
            `;
        }).join('');
    };

    // --- SMART ADD TO CART ---
    window.handleItemClick = (catKey, itemName) => {
        const item = fullMenu[catKey].find(i => i.name === itemName);
        
        // Check for multiple price points
        let options = null;
        if(item.sizes) options = item.sizes;
        else if(item.price5pc) options = { "5 Pcs": item.price5pc, "10 Pcs": item.price10pc };
        else if(item.priceHalf) options = { "Half": item.priceHalf, "Full": item.priceFull };
        else if(item.priceS) options = { "Small": item.priceS, "Large": item.priceL };

        if(options) {
            openSelectionModal(item.name, options);
        } else {
            addToCart(item.name, item.price);
        }
    };

    function openSelectionModal(name, opts) {
        document.getElementById('selectionModal').classList.add('open');
        document.getElementById('modalItemName').innerText = name;
        document.getElementById('optionsContainer').innerHTML = Object.entries(opts).map(([key, val]) => val ? `
            <div class="opt-row" onclick="addToCart('${name} (${key})', ${val})">
                <span>${key}</span><span>Rs. ${val}</span>
            </div>
        ` : '').join('');
    }

    window.addToCart = (fullName, price) => {
        const exist = currentCart.find(i => i.name === fullName);
        if(exist) exist.qty++;
        else currentCart.push({ name: fullName, price, qty: 1 });
        updateCartUI();
        closeModal();
    };

    function updateCartUI() {
        document.getElementById('cartItems').innerHTML = currentCart.map(i => `
            <div class="cart-row">
                <span><b>${i.qty}x</b> ${i.name}</span>
                <span style="color:var(--gold); font-weight:800;">Rs.${i.price * i.qty}</span>
            </div>
        `).join('');
        const total = currentCart.reduce((acc, i) => acc + (i.price * i.qty), 0);
        document.getElementById('cartTotal').innerText = `Rs. ${total}`;
    }

    window.sendOrder = () => {
        if(currentCart.length === 0) return;
        push(ref(db, 'orders'), {
            items: currentCart,
            total: currentCart.reduce((acc, i) => acc + (i.price * i.qty), 0),
            status: "new",
            timestamp: Date.now(),
            date: new Date().toLocaleDateString()
        }).then(() => {
            alert("Order Dispatched!");
            currentCart = []; updateCartUI();
            if(window.innerWidth < 950) toggleCart();
        });
    };

    // --- KDS & STATS ---
    function startKDS() {
        onValue(ref(db, 'orders'), (snap) => {
            const data = snap.val();
            if(!data) return;
            const orders = Object.entries(data).map(([id, val]) => ({id, ...val})).reverse();
            
            // Render KDS
            document.getElementById('kdsGrid').innerHTML = orders.filter(o => o.status !== 'done').map(o => `
                <div style="background:var(--card); padding:15px; border-radius:15px; border-top:5px solid var(--red);">
                    <div style="display:flex; justify-content:space-between">
                        <span style="font-weight:900">#${o.id.slice(-4)}</span>
                        <span style="background:var(--red); font-size:10px; padding:3px 8px; border-radius:5px;">${o.status.toUpperCase()}</span>
                    </div>
                    <div style="margin:15px 0; color:#888; font-size:14px;">
                        ${o.items.map(i => `${i.qty}x ${i.name}`).join('<br>')}
                    </div>
                    <button class="btn-pay" style="padding:10px; font-size:14px;" onclick="advanceOrder('${o.id}', '${o.status}')">NEXT STEP</button>
                </div>
            `).join('');

            // Sales
            const today = new Date().toLocaleDateString();
            const todayOrders = orders.filter(o => o.date === today);
            document.getElementById('statRev').innerText = "Rs. " + todayOrders.reduce((s,o)=>s+o.total,0).toLocaleString();
            document.getElementById('statOrders').innerText = todayOrders.length;
        });
    }

    window.advanceOrder = (id, current) => {
        const next = current === 'new' ? 'preparing' : current === 'preparing' ? 'ready' : 'done';
        update(ref(db, `orders/${id}`), { status: next });
    };

    window.switchView = (v) => {
        document.getElementById('view-pos').style.display = v === 'pos' ? 'flex' : 'none';
        document.getElementById('view-kds').style.display = v === 'kds' ? 'block' : 'none';
        document.getElementById('view-dash').style.display = v === 'dash' ? 'block' : 'none';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.currentTarget.classList.add('active');
    };

    window.closeModal = () => document.getElementById('selectionModal').classList.remove('open');
    window.toggleCart = () => document.getElementById('cartSide').classList.toggle('open');
</script>
</body>
</html>
