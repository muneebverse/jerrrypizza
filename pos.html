<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jerry POS | Full Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --red: #E8001D; --gold: #fbbf24; --dark: #0a0a0a; --card: #161616; --border: #2e2e2e; --text: #f0f0f0; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: 'Nunito', sans-serif; background: var(--dark); color: var(--text); height: 100dvh; overflow: hidden; }

        /* PIN LOCK SCREEN */
        #lock-screen { position: fixed; inset: 0; background: var(--dark); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .pin-grid { display: grid; grid-template-columns: repeat(3, 80px); gap: 15px; margin-top: 25px; }
        .pin-btn { height: 75px; border-radius: 15px; border: 2px solid var(--border); background: var(--card); color: white; font-size: 26px; font-weight: 900; }
        .pin-btn:active { background: var(--red); transform: scale(0.9); }

        /* LAYOUT */
        #app { display: none; flex-direction: column; height: 100dvh; }
        #app.visible { display: flex; }
        .topbar { height: 60px; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 2px solid var(--red); flex-shrink: 0; }
        
        .tab-nav { display: flex; background: #000; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
        .tab { flex: 1; min-width: 100px; padding: 15px; text-align: center; font-weight: 900; font-size: 13px; color: #666; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--red); border-bottom-color: var(--red); }

        /* POS VIEW */
        .pos-view { display: flex; flex: 1; overflow: hidden; }
        .menu-side { flex: 1; display: flex; flex-direction: column; background: #000; }
        .cat-slider { display: flex; gap: 10px; padding: 12px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .cat-pill { background: var(--card); border: 1px solid var(--border); padding: 10px 20px; border-radius: 50px; white-space: nowrap; font-weight: 800; font-size: 13px; }
        .cat-pill.active { background: var(--red); border-color: var(--red); }

        .menu-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; padding: 12px; align-content: start; }
        .item-card { background: var(--card); border-radius: 15px; border: 1px solid var(--border); padding: 12px; text-align: center; position: relative; }
        .item-card:active { transform: scale(0.95); border-color: var(--gold); }
        .item-name { font-size: 12px; font-weight: 800; line-height: 1.2; height: 30px; margin: 8px 0; overflow: hidden; }
        .item-price { color: var(--gold); font-weight: 900; font-size: 14px; }

        /* CART (SIDEBAR / BOTTOM SHEET) */
        .cart-side { width: 350px; background: #080808; border-left: 1px solid var(--border); display: flex; flex-direction: column; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @media (max-width: 950px) {
            .cart-side { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; height: 75dvh; z-index: 2000; transform: translateY(100%); border-radius: 25px 25px 0 0; border-top: 5px solid var(--red); border-left: none; }
            .cart-side.open { transform: translateY(0); }
        }
        .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px; background: var(--card); border-radius: 10px; margin-bottom: 10px; font-size: 14px; }
        .cart-footer { padding: 20px; background: var(--card); border-top: 1px solid var(--border); }

        /* MODALS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.open { display: flex; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; }
        .opt-btn { display: flex; justify-content: space-between; padding: 15px; border: 1px solid var(--border); border-radius: 12px; margin-top: 10px; font-weight: 800; cursor: pointer; }
        .opt-btn:active { background: var(--red); }

        /* BUTTONS */
        .btn-main { width: 100%; padding: 18px; border-radius: 15px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; background: var(--red); color: white; }
        .btn-float { position: fixed; bottom: 20px; right: 20px; width: 65px; height: 65px; background: var(--red); border-radius: 50%; display: none; justify-content: center; align-items: center; font-size: 28px; z-index: 1500; box-shadow: 0 5px 15px rgba(0,0,0,0.5); border: none; color: white; }
        @media (max-width: 950px) { .btn-float { display: flex; } }

        /* KDS / DASHBOARD */
        .order-card { background: var(--card); border-radius: 15px; padding: 15px; border-top: 4px solid var(--gold); }
        .status-badge { padding: 4px 10px; border-radius: 50px; font-size: 10px; font-weight: 900; text-transform: uppercase; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 15px; border-left: 5px solid var(--red); }
    </style>
</head>
<body>

<div id="lock-screen">
    <div style="font-family:'Bebas Neue'; color:var(--red); font-size:50px;">JERRY PIZZA</div>
    <div id="pin-display" style="font-size:40px; letter-spacing:15px; margin: 20px 0;">____</div>
    <div class="pin-grid">
        <script>for(let i=1;i<=9;i++) document.write(`<button class="pin-btn" onclick="pressPin('${i}')">${i}</button>`);</script>
        <button class="pin-btn" onclick="pinStr=''">C</button>
        <button class="pin-btn" onclick="pressPin('0')">0</button>
        <button class="pin-btn" onclick="unlock()" style="background:var(--red)">OK</button>
    </div>
</div>

<div id="app">
    <div class="topbar">
        <div style="font-family:'Bebas Neue'; color:var(--red); font-size:24px;">TERMINAL</div>
        <div id="clock" style="font-weight:900; color:var(--gold)">12:00 PM</div>
    </div>

    <div class="tab-nav">
        <div class="tab active" onclick="switchTab('pos')">🛒 POS</div>
        <div class="tab" onclick="switchTab('kds')">🔥 KITCHEN</div>
        <div class="tab" onclick="switchTab('stats')">📊 STATS</div>
        <div class="tab" onclick="location.reload()">🔒 LOCK</div>
    </div>

    <!-- POS VIEW -->
    <div id="view-pos" class="pos-view">
        <div class="menu-side">
            <div class="cat-slider" id="catSlider"></div>
            <div class="menu-grid" id="menuGrid"></div>
        </div>
        <aside class="cart-side" id="cartSide">
            <div style="padding:15px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between">
                <span style="font-weight:900">NEW ORDER</span>
                <button onclick="toggleCart()" style="background:none; border:none; color:var(--red); font-weight:900">CLOSE</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-footer">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-size:22px; font-weight:900">
                    <span>Total</span><span id="cartTotal" style="color:var(--gold)">Rs. 0</span>
                </div>
                <button class="btn-main" onclick="checkout()">PLACE ORDER</button>
            </div>
        </aside>
    </div>

    <!-- KITCHEN VIEW -->
    <div id="view-kds" style="display:none; flex:1; overflow-y:auto; padding:20px;">
        <div id="kdsGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px;"></div>
    </div>

    <!-- STATS VIEW -->
    <div id="view-stats" style="display:none; flex:1; overflow-y:auto; padding:20px;">
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:20px;">
            <div class="stat-card"><h3>Revenue Today</h3><p id="statRev" style="font-size:28px; font-weight:900; color:var(--gold)">Rs. 0</p></div>
            <div class="stat-card"><h3>Total Orders</h3><p id="statOrders" style="font-size:28px; font-weight:900; color:var(--gold)">0</p></div>
        </div>
    </div>

    <button class="btn-float" onclick="toggleCart()">🛒</button>
</div>

<!-- MODALS -->
<div class="modal" id="optModal">
    <div class="modal-content">
        <h2 id="optTitle">Select Option</h2>
        <div id="optContainer"></div>
        <button onclick="closeModal()" style="width:100%; margin-top:20px; padding:10px; background:none; border:1px solid #444; color:#888; border-radius:10px;">Cancel</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getDatabase, ref, get, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-database.js";

    const fbConfig = {
        apiKey: "AIzaSyBG-J0dzxS70Fr7-VPf1SQ8Fiq0fRzNAq8",
        authDomain: "jerry-pos.firebaseapp.com",
        projectId: "jerry-pos",
        databaseURL: "https://jerry-pos-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(fbConfig);
    const db = getDatabase(app);

    window.pinStr = "";
    let menuData = null;
    let cart = [];

    // --- SECURITY & LOCK ---
    window.pressPin = (n) => {
        if(pinStr.length < 4) pinStr += n;
        document.getElementById('pin-display').innerText = "●".repeat(pinStr.length).padEnd(4, '_');
    };

    window.unlock = async () => {
        const snap = await get(ref(db, `system/pins/${pinStr}`));
        if(snap.exists()) {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('app').classList.add('visible');
            loadSystem();
        } else {
            alert("❌ Incorrect PIN"); pinStr = ""; pressPin('');
        }
    };

    // --- DATA HANDLING ---
    async function loadSystem() {
        const snap = await get(ref(db, 'system/menu'));
        menuData = snap.val();
        renderCats();
        renderItems("bestPizzas");
        listenLive();
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        }, 1000);
    }

    function renderCats() {
        const cats = Object.keys(menuData);
        document.getElementById('catSlider').innerHTML = cats.map(c => `
            <div class="cat-pill" onclick="renderItems('${c}')">${c.replace(/([A-Z])/g, ' $1')}</div>
        `).join('');
    }

    window.renderItems = (cat) => {
        document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
        const grid = document.getElementById('menuGrid');
        const items = menuData[cat];
        grid.innerHTML = items.map(i => `
            <div class="item-card" onclick="itemClick('${cat}', '${i.name}')">
                <div style="font-size:35px">${i.emoji || '🍕'}</div>
                <div class="item-name">${i.name}</div>
                <div class="item-price">Rs. ${i.price || i.sizes?.S || i.price5pc || i.priceHalf}</div>
            </div>
        `).join('');
    };

    window.itemClick = (cat, name) => {
        const item = menuData[cat].find(i => i.name === name);
        if(item.sizes) openModal(item, item.sizes);
        else if(item.price5pc) openModal(item, { "5 Pcs": item.price5pc, "10 Pcs": item.price10pc });
        else if(item.priceHalf) openModal(item, { "Half": item.priceHalf, "Full": item.priceFull });
        else if(item.priceS) openModal(item, { "Small": item.priceS, "Large": item.priceL });
        else addToCart(item.name, item.price);
    };

    function openModal(item, options) {
        document.getElementById('optModal').classList.add('open');
        document.getElementById('optTitle').innerText = item.name;
        document.getElementById('optContainer').innerHTML = Object.entries(options).map(([k, v]) => v ? `
            <div class="opt-btn" onclick="addToCart('${item.name} (${k})', ${v})">
                <span>${k}</span><span>Rs. ${v}</span>
            </div>
        ` : '').join('');
    }

    window.addToCart = (name, price) => {
        const exist = cart.find(c => c.name === name);
        if(exist) exist.qty++;
        else cart.push({ name, price, qty: 1 });
        updateCartUI();
        closeModal();
    };

    function updateCartUI() {
        document.getElementById('cartItems').innerHTML = cart.map((i, idx) => `
            <div class="cart-item">
                <div><b>${i.qty}x</b> ${i.name}</div>
                <div style="color:var(--gold)">Rs. ${i.price * i.qty}</div>
            </div>
        `).join('');
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        document.getElementById('cartTotal').innerText = `Rs. ${total}`;
    }

    window.checkout = () => {
        if(cart.length === 0) return;
        push(ref(db, 'orders'), {
            items: cart,
            total: cart.reduce((s, i) => s + (i.price * i.qty), 0),
            status: "new",
            timestamp: Date.now(),
            date: new Date().toLocaleDateString()
        }).then(() => {
            alert("✅ Order Placed!");
            cart = []; updateCartUI();
            if(window.innerWidth < 950) toggleCart();
        });
    };

    function listenLive() {
        onValue(ref(db, 'orders'), (snap) => {
            const data = snap.val();
            if(!data) return;
            const orders = Object.entries(data).map(([k, v]) => ({id: k, ...v})).reverse();
            
            // KDS
            document.getElementById('kdsGrid').innerHTML = orders.filter(o => o.status !== 'done').map(o => `
                <div class="order-card">
                    <div style="display:flex; justify-content:space-between">
                        <span style="font-weight:900">#${o.id.slice(-4)}</span>
                        <span class="status-badge" style="background:var(--red)">${o.status}</span>
                    </div>
                    <div style="margin:15px 0; color:#aaa; font-size:14px">
                        ${o.items.map(i => `${i.qty}x ${i.name}`).join('<br>')}
                    </div>
                    <button class="btn-main" style="padding:10px; font-size:14px" onclick="nextStatus('${o.id}', '${o.status}')">PROCEED</button>
                </div>
            `).join('');

            // Stats
            const today = new Date().toLocaleDateString();
            const todayOrders = orders.filter(o => o.date === today);
            document.getElementById('statRev').innerText = "Rs. " + todayOrders.reduce((s,o)=>s+o.total, 0).toLocaleString();
            document.getElementById('statOrders').innerText = todayOrders.length;
        });
    }

    window.nextStatus = (id, cur) => {
        const next = cur === 'new' ? 'preparing' : cur === 'preparing' ? 'ready' : 'done';
        update(ref(db, `orders/${id}`), { status: next });
    };

    window.switchTab = (id) => {
        document.querySelectorAll('.pos-view, #view-kds, #view-stats').forEach(v => v.style.display = 'none');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('view-'+id).style.display = id === 'pos' ? 'flex' : 'block';
        event.currentTarget.classList.add('active');
    };

    window.closeModal = () => document.getElementById('optModal').classList.remove('open');
    window.toggleCart = () => document.getElementById('cartSide').classList.toggle('open');
</script>
</body>
</html>
