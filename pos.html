<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jerry POS | Secure Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    :root { --red: #E8001D; --gold: #fbbf24; --dark: #0a0a0a; --card: #161616; --border: #2e2e2e; --text: #f0f0f0; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: var(--dark); color: var(--text); height: 100dvh; overflow: hidden; }

    /* Touch Optimized PIN */
    #pin-screen { position: fixed; inset: 0; background: var(--dark); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .pin-grid { display: grid; grid-template-columns: repeat(3, 85px); gap: 15px; margin-top: 20px; }
    .pin-btn { height: 75px; border-radius: 15px; border: 2px solid var(--border); background: var(--card); color: white; font-size: 26px; font-weight: 900; }
    .pin-btn:active { background: var(--red); transform: scale(0.92); }

    /* Main App */
    #app { display: none; flex-direction: column; height: 100dvh; }
    #app.visible { display: flex; }
    
    .topbar { height: 60px; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 2px solid var(--red); }
    
    /* Horizontal Category Slider */
    .cat-slider { display: flex; gap: 10px; overflow-x: auto; padding: 12px; scrollbar-width: none; background: #000; }
    .cat-pill { background: var(--card); border: 1px solid var(--border); padding: 10px 22px; border-radius: 50px; white-space: nowrap; font-weight: 800; font-size: 14px; }
    .cat-pill.active { background: var(--red); border-color: var(--red); }

    .main-content { display: flex; flex: 1; overflow: hidden; }
    .menu-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 12px; align-content: start; }
    
    /* Item Card */
    .item-card { background: var(--card); border-radius: 15px; border: 1px solid var(--border); padding: 15px; text-align: center; }
    .item-card:active { transform: scale(0.96); border-color: var(--gold); }
    .item-name { font-size: 13px; font-weight: 800; height: 34px; overflow: hidden; margin: 8px 0; }
    .item-price { color: var(--gold); font-weight: 900; }

    /* Responsive Cart Bottom Sheet */
    .cart-side { width: 360px; background: #080808; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
    @media (max-width: 900px) {
        .cart-side { position: fixed; bottom: 0; width: 100%; height: 75dvh; transform: translateY(100%); z-index: 2000; transition: 0.3s; border-radius: 25px 25px 0 0; border-top: 4px solid var(--red); }
        .cart-side.open { transform: translateY(0); }
    }
    .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
    .cart-footer { padding: 20px; background: var(--card); }
    
    .btn-checkout { background: var(--red); color: white; border: none; width: 100%; padding: 18px; border-radius: 12px; font-weight: 900; font-size: 18px; }
    .mobile-cart-trigger { display: none; position: fixed; bottom: 25px; right: 25px; background: var(--red); width: 65px; height: 65px; border-radius: 50%; justify-content: center; align-items: center; z-index: 100; font-size: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
    @media (max-width: 900px) { .mobile-cart-trigger { display: flex; } }

    /* Size Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal.open { display: flex; }
    .size-box { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; }
    .size-btn { display: flex; justify-content: space-between; padding: 15px; border: 1px solid var(--border); border-radius: 10px; margin-top: 10px; font-weight: 800; }
</style>
</head>
<body>

<div id="pin-screen">
    <h1 style="font-family:'Bebas Neue'; color:var(--red); font-size:48px;">JERRY POS</h1>
    <div id="pin-dots" style="font-size:40px; letter-spacing:15px; color:var(--gold);">____</div>
    <div class="pin-grid">
        <script>
            for(let i=1; i<=9; i++) document.write(`<button class="pin-btn" onclick="pressPin('${i}')">${i}</button>`);
        </script>
        <button class="pin-btn" onclick="clearPin()">C</button>
        <button class="pin-btn" onclick="pressPin('0')">0</button>
        <button class="pin-btn" onclick="submitPin()" style="background:var(--red)">OK</button>
    </div>
</div>

<div id="app">
    <div class="topbar">
        <h2 style="font-family:'Bebas Neue'; color:var(--red)">JERRY TERMINAL</h2>
        <div id="clock" style="font-weight:900; color:var(--gold)">00:00</div>
    </div>

    <div class="cat-slider" id="catSlider"></div>

    <div class="main-content">
        <div class="menu-grid" id="menuGrid"></div>

        <aside class="cart-side" id="cartSide">
            <div style="padding:15px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between">
                <span style="font-weight:900">ORDER SUMMARY</span>
                <button onclick="toggleCart()" style="background:none; border:none; color:var(--red); font-weight:900">CLOSE</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-footer">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-size:20px; font-weight:900">
                    <span>Total</span>
                    <span id="cartTotal" style="color:var(--gold)">Rs. 0</span>
                </div>
                <button class="btn-checkout" onclick="placeOrder()">CHECKOUT</button>
            </div>
        </aside>
    </div>
    
    <div class="mobile-cart-trigger" onclick="toggleCart()">🛒</div>
</div>

<!-- Size Modal -->
<div class="modal" id="sizeModal">
    <div class="size-box">
        <h2 id="sizeItemName" style="margin-bottom:15px">Select Size</h2>
        <div id="sizeOptions"></div>
        <button onclick="closeModal()" style="margin-top:20px; width:100%; padding:10px; background:none; border:1px solid #444; color:#888; border-radius:10px;">Cancel</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getDatabase, ref, get, push, set } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-database.js";

    const fbConfig = {
        apiKey: "AIzaSyBG-J0dzxS70Fr7-VPf1SQ8Fiq0fRzNAq8",
        authDomain: "jerry-pos.firebaseapp.com",
        projectId: "jerry-pos",
        databaseURL: "https://jerry-pos-default-rtdb.firebaseio.com"
    };

    const fb = initializeApp(fbConfig);
    const db = getDatabase(fb);

    let pinInput = "";
    let menuData = [];
    let cart = [];
    let currentCategory = "Pizzas";

    // --- SECURE PIN SYSTEM ---
    window.pressPin = (n) => {
        if(pinInput.length < 4) pinInput += n;
        updatePinDots();
    };
    window.clearPin = () => { pinInput = ""; updatePinDots(); };
    window.updatePinDots = () => {
        document.getElementById('pin-dots').innerText = "●".repeat(pinInput.length).padEnd(4, '_');
    };
    window.submitPin = async () => {
        const snap = await get(ref(db, `system/pins/${pinInput}`));
        if(snap.exists()) {
            document.getElementById('pin-screen').style.display = 'none';
            document.getElementById('app').classList.add('visible');
            loadData();
        } else {
            alert("❌ Invalid PIN");
            clearPin();
        }
    };

    // --- DATA LOADING ---
    async function loadData() {
        const snap = await get(ref(db, 'system/menu'));
        menuData = snap.val();
        renderCategories();
        renderMenu("Pizzas");
        updateClock();
        setInterval(updateClock, 1000);
    }

    function renderCategories() {
        const cats = [...new Set(menuData.map(i => i.cat))];
        const slider = document.getElementById('catSlider');
        slider.innerHTML = cats.map(c => `
            <div class="cat-pill ${c === currentCategory ? 'active' : ''}" onclick="changeCat('${c}')">${c}</div>
        `).join('');
    }

    window.changeCat = (cat) => {
        currentCategory = cat;
        renderCategories();
        renderMenu(cat);
    };

    window.renderMenu = (cat) => {
        const grid = document.getElementById('menuGrid');
        const items = menuData.filter(i => i.cat === cat);
        grid.innerHTML = items.map(i => {
            const priceDisplay = i.sizes ? `Rs. ${i.sizes.S}+` : (i.price ? `Rs. ${i.price}` : `Rs. ${i.priceHalf || i.price5pc}`);
            return `
                <div class="item-card" onclick="handleItemClick('${i.name}')">
                    <div style="font-size:30px">${i.emoji || '🍕'}</div>
                    <div class="item-name">${i.name}</div>
                    <div class="item-price">${priceDisplay}</div>
                </div>
            `;
        }).join('');
    };

    window.handleItemClick = (name) => {
        const item = menuData.find(i => i.name === name);
        if(item.sizes) {
            openSizeModal(item);
        } else if(item.price5pc) {
            // Handle Wings/Nuggets
            openWingsModal(item);
        } else {
            addToCart(item.name, item.price);
        }
    };

    // --- CART SYSTEM ---
    window.addToCart = (name, price, size = "") => {
        const entryName = size ? `${name} (${size})` : name;
        const exist = cart.find(i => i.name === entryName);
        if(exist) exist.qty++;
        else cart.push({ name: entryName, price: price, qty: 1 });
        updateCartUI();
        if(size) closeModal();
    };

    function updateCartUI() {
        const list = document.getElementById('cartItems');
        list.innerHTML = cart.map((i, idx) => `
            <div class="cart-item" style="background:#111; padding:10px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between">
                <div><b>${i.qty}x</b> ${i.name}</div>
                <div style="color:var(--gold)">Rs. ${i.price * i.qty}</div>
            </div>
        `).join('');
        const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
        document.getElementById('cartTotal').innerText = `Rs. ${total}`;
    }

    // --- MODALS ---
    function openSizeModal(item) {
        document.getElementById('sizeModal').classList.add('open');
        document.getElementById('sizeItemName').innerText = item.name;
        document.getElementById('sizeOptions').innerHTML = Object.entries(item.sizes).map(([sz, pr]) => `
            <div class="size-btn" onclick="addToCart('${item.name}', ${pr}, '${sz}')">
                <span>Size: ${sz}</span>
                <span>Rs. ${pr}</span>
            </div>
        `).join('');
    }
    window.closeModal = () => document.getElementById('sizeModal').classList.remove('open');

    window.toggleCart = () => document.getElementById('cartSide').classList.toggle('open');

    window.placeOrder = () => {
        if(cart.length === 0) return;
        push(ref(db, 'orders'), {
            items: cart,
            total: cart.reduce((acc, i) => acc + (i.price * i.qty), 0),
            status: "new",
            timestamp: Date.now()
        }).then(() => {
            alert("✅ Order Sent to Kitchen!");
            cart = []; updateCartUI();
            if(window.innerWidth < 900) toggleCart();
        });
    };

    function updateClock() {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }
</script>
</body>
</html>
