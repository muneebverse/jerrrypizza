<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>21 Exclusive Pizza Deals in Sahiwal | Jerry Pizza | Free Delivery</title>
  <meta name="description" content="21 exclusive pizza & burger deals at Jerry Pizza Sahiwal – MUFTA Deal Rs.2699, combo offers, free delivery within 2km. Save big on pizzas, burgers & more.">
  <link rel="canonical" href="https://jerrypizza.me/deals">
  
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Satisfy&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBG-J0dzxS70Fr7-VPf1SQ8Fiq0fRzNAq8",
      authDomain: "jerry-pos.firebaseapp.com",
      projectId: "jerry-pos",
      storageBucket: "jerry-pos.firebasestorage.app",
      messagingSenderId: "771100017615",
      appId: "1:771100017615:web:ae7342c89b3b697cdd48ba"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window._db = db;
    window._collection = collection;
    window._addDoc = addDoc;
    window._fbReady = true;
    document.dispatchEvent(new Event('fbReady'));
  </script>
  <script src="menu-data.js"></script>
<script src="link.js"></script>
</head>
<body>

<div class="cart-overlay" id="overlay" onclick="closeAll()"></div>

<aside class="cart-drawer" id="cart-drawer" style="display: flex; flex-direction: column; height: 100vh;">
  
  <div class="cart-header" style="flex-shrink: 0;">
    <h3>YOUR CART</h3>
    <span class="close-cart" onclick="toggleCartDrawer()"><i class="fa-solid fa-xmark"></i></span>
  </div>

  <div class="cart-body" style="flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 20px;">
    <ul class="cart-items" id="cart-items-list" style="margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px;"></ul>
    <div id="cart-empty-msg" class="cart-empty">
      <i class="fa-solid fa-pizza-slice" style="font-size:2rem; color:var(--muted); display:block; margin-bottom:12px;"></i>
      Your cart is empty.
    </div>
  </div>

  <div class="cart-footer" style="flex-shrink: 0;">
    <div class="cart-total" id="cart-total-row" style="display:none;">
      <span>Total</span>
      <span id="cart-total-price">Rs. 0</span>
    </div>
    <div class="checkout-form" id="checkout-form" style="display:none;">
      <input type="text" id="cust-name" placeholder="Your Name" required>
      <input type="tel" id="cust-phone" placeholder="Phone Number" required>
      <textarea id="cust-address" placeholder="Delivery Address" rows="2" required></textarea>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" id="checkout-btn" onclick="checkoutToWhatsApp()">
      <i class="fa-brands fa-whatsapp"></i> Place Order via WhatsApp
    </button>
  </div>

</aside>

<header class="global-header" style="margin-bottom: 70px;">
  <div class="container-nav">
    <a href="/" class="logo">
      <img src="assets/logo.png" alt="Jerry Pizza" class="logo-img" width="50">
      JERRY <span>PIZZA</span>
    </a>
    <nav class="main-nav" id="nav-menu">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/menu">Menu</a></li>
        <li><a href="/deals" class="active">Deals</a></li>
        <li><a href="/about">About Us</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <button class="cart-trigger" onclick="toggleCartDrawer()">
        🛒 Cart <span class="cart-badge" id="global-cart-badge">0</span>
      </button>
      <button class="hamburger" id="hamburger" onclick="toggleNav()">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </button>
    </div>
  </div>
</header>

<main style="padding-top: 40px; padding-bottom: 60px;">
  <div class="container text-center anim-fade-up" style="margin-bottom: 60px;">
    <span class="section-label">Save Big Today</span>
    <h1 class="section-title" style="color: #333;">21 Exclusive Pizza Deals</h1>
    <div class="gold-divider"></div>
  </div>
  <div class="container">
    <div class="deals-grid" id="deals-grid"></div>
  </div>
</main>

<script src="menu-data.js"></script>
<script src="app.js"></script>
</body>
</html>
