<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jerry Waiter | Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --red: #E8001D; --dark: #0a0a0a; --card: #1a1a1a; --border: #2e2e2e; }
        body { font-family: 'Nunito', sans-serif; background: var(--dark); color: white; margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .header { height: 60px; background: #000; border-bottom: 2px solid var(--red); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        
        .cat-nav { display: flex; overflow-x: auto; padding: 12px; gap: 10px; background: #000; scrollbar-width: none; }
        .cat-btn { padding: 10px 20px; background: var(--card); border: 1px solid var(--border); border-radius: 50px; white-space: nowrap; font-size: 14px; font-weight: 800; }
        .cat-btn.active { background: var(--red); border-color: var(--red); }

        .menu-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .menu-row { background: var(--card); padding: 18px; border-radius: 15px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .menu-row:active { background: #222; transform: scale(0.97); }

        .cart-bar { height: 95px; background: var(--card); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .btn-send { background: var(--red); color: white; border: none; padding: 15px 30px; border-radius: 40px; font-weight: 900; font-size: 16px; box-shadow: 0 4px 12px rgba(232,0,29,0.3); }

        /* Shared Modal Style from POS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; flex-direction: column; padding: 25px; }
        .modal.open { display: flex; }
        .opt-btn { padding: 18px; border: 1px solid var(--border); border-radius: 15px; margin-top: 12px; font-weight: 800; display: flex; justify-content: space-between; }
        input { background: #222; border: 1px solid var(--border); color: white; padding: 15px; border-radius: 12px; font-size: 18px; width: 100%; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="header">
    <span style="font-family:'Bebas Neue'; color:var(--red); font-size:24px;">JERRY WAITER</span>
    <span onclick="location.reload()" style="font-size:12px; border:1px solid #444; padding:4px 10px; border-radius:5px;">LOGOUT</span>
</div>

<div class="cat-nav" id="catNav"></div>
<div class="menu-list" id="menuList"></div>

<div class="cart-bar">
    <div>
        <div style="font-size:12px; color:#888">Qty: <span id="qty">0</span></div>
        <div style="font-size:20px; font-weight:900; color:#fbbf24">Rs. <span id="tot">0</span></div>
    </div>
    <button class="btn-send" onclick="openCheck()">SEND ORDER</button>
</div>

<!-- Modal -->
<div class="modal" id="waiterModal">
    <h2 id="mTitle" style="font-family:'Bebas Neue'; color:var(--red); font-size:32px;">Options</h2>
    <div id="mOpts" style="flex:1; overflow-y:auto;"></div>
    <button onclick="closeM()" style="margin-top:15px; color:#888; background:none; border:none; font-weight:800;">CLOSE</button>
</div>

<!-- Final Checkout -->
<div class="modal" id="checkModal">
    <h2 style="font-family:'Bebas Neue'; color:var(--red); font-size:32px;">Finalize</h2>
    <input type="text" id="tNum" placeholder="Table # or Name">
    <div id="fList" style="flex:1; overflow-y:auto; color:#aaa; font-size:14px; line-height:2;"></div>
    <button class="btn-send" style="width:100%" onclick="finish()">SEND TO KITCHEN</button>
    <button onclick="document.getElementById('checkModal').classList.remove('open')" style="margin-top:20px; color:#888; background:none; border:none; font-weight:800;">BACK</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getDatabase, ref, get, push } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-database.js";

    const fbApp = initializeApp({
        apiKey: "AIzaSyBG-J0dzxS70Fr7-VPf1SQ8Fiq0fRzNAq8",
        authDomain: "jerry-pos.firebaseapp.com",
        projectId: "jerry-pos",
        databaseURL: "https://jerry-pos-default-rtdb.firebaseio.com"
    });
    const db = getDatabase(fbApp);

    let menu = null; let cart = []; let activeC = "bestPizzas";

    async function load() {
        const s = await get(ref(db, 'system/menu')); menu = s.val();
        renderC(); filter("bestPizzas");
    }

    function renderC() {
        document.getElementById('catNav').innerHTML = Object.keys(menu).map(k => `
            <div class="cat-btn ${k===activeC?'active':''}" onclick="filter('${k}')">${k.replace(/([A-Z])/g,' $1').toUpperCase()}</div>
        `).join('');
    }

    window.filter = (k) => {
        activeC = k; renderC();
        document.getElementById('menuList').innerHTML = menu[k].map(i => `
            <div class="menu-row" onclick="clickItem('${k}','${i.name}')">
                <span style="font-weight:800">${i.name}</span>
                <span style="color:#fbbf24; font-weight:900">Rs.${i.price||i.sizes?.S||i.price5pc||i.priceHalf||i.priceS}</span>
            </div>
        `).join('');
    };

    window.clickItem = (k, n) => {
        const i = menu[k].find(x => x.name === n);
        let o = i.sizes || (i.price5pc?{"5pc":i.price5pc,"10pc":i.price10pc}:null) || (i.priceHalf?{"Half":i.priceHalf,"Full":i.priceFull}:null) || (i.priceS?{"Small":i.priceS,"Large":i.priceL}:null);
        if(o) {
            document.getElementById('waiterModal').classList.add('open');
            document.getElementById('mTitle').innerText = i.name;
            document.getElementById('mOpts').innerHTML = Object.entries(o).map(([key,v]) => `
                <div class="opt-btn" onclick="add('${i.name} (${key})', ${v})"><span>${key}</span><span>Rs.${v}</span></div>
            `).join('');
        } else add(i.name, i.price);
    };

    window.add = (n, p) => {
        const x = cart.find(i => i.name === n);
        if(x) x.qty++; else cart.push({name:n, price:p, qty:1});
        up(); closeM();
    };

    function up() {
        document.getElementById('qty').innerText = cart.reduce((a,b)=>a+b.qty,0);
        document.getElementById('tot').innerText = cart.reduce((a,b)=>a+(b.price*b.qty),0);
    }

    window.openCheck = () => {
        if(!cart.length) return;
        document.getElementById('checkModal').classList.add('open');
        document.getElementById('fList').innerHTML = cart.map(i => `${i.qty}x ${i.name}`).join('<br>');
    };

    window.finish = () => {
        const t = document.getElementById('tNum').value; if(!t) return alert("Table #?");
        push(ref(db, 'orders'), {
            items: cart, total: cart.reduce((a,b)=>a+(b.price*b.qty),0),
            status: "new", table: t, timestamp: Date.now(), date: new Date().toLocaleDateString()
        }).then(() => {
            alert("Sent!"); cart = []; up();
            document.getElementById('checkModal').classList.remove('open');
            document.getElementById('tNum').value = "";
        });
    };

    window.closeM = () => document.getElementById('waiterModal').classList.remove('open');
    load();
</script>
</body>
</html>
